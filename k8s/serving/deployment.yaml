apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadsentry-api
  namespace: leadsentry-prod
  labels:
    app.kubernetes.io/name: leadsentry-api
    app.kubernetes.io/component: inference
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: leadsentry-api
  template:
    metadata:
      labels:
        app: leadsentry-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-username/leadsentry-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: leadsentry-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
